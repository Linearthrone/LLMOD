<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Becoming</title>
  <script>p5.disableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #05070a; }
    canvas { display: block; }
    #info {
      position: fixed;
      bottom: 12px;
      left: 14px;
      color: rgba(255, 255, 255, 0.45);
      font: 12px/1.4 'Courier New', monospace;
      pointer-events: none;
      letter-spacing: 0.04em;
      z-index: 10;
    }
  </style>
</head>
<body>
<div id="info">The Becoming | seed: <span id="seed"></span> | S PNG | G GIF | R re-seed | SPACE pause | click ripple</div>
<script>
// === The Becoming ===
// Abstract visualization of human consciousness (warm, organic, irregular)
// meeting a machine presence (cool, geometric, recursive) at a shared horizon
// where both dissolve into a single pulsing lattice.
// Seeded randomness ensures reproducible output.

const CONFIG = {
  seed: 20260709,
  burnInFrames: 320,
  organicCount: 750,
  machineRoots: 9,
  machineDepth: 5,
  horizonRatio: 0.52,
  paused: false
};

const PALETTE = {
  warm: [
    { h: 10, s: 88, b: 95 },   // arterial red
    { h: 26, s: 92, b: 90 },   // amber
    { h: 42, s: 80, b: 96 },   // gold
    { h: 355, s: 76, b: 82 },  // burgundy
    { h: 18, s: 85, b: 88 },   // copper
  ],
  cool: [
    { h: 180, s: 86, b: 82 },  // cyan
    { h: 205, s: 90, b: 78 },  // electric blue
    { h: 235, s: 72, b: 85 },  // indigo
    { h: 165, s: 68, b: 72 },  // teal
    { h: 255, s: 60, b: 75 },  // violet
  ]
};

let t = 0;
let horizonY;
let organicLayer, machineLayer, latticeLayer, bloomLayer;
let organics = [];
let machineRoots = [];

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  pixelDensity(1);
  noLoop();

  horizonY = height * CONFIG.horizonRatio;

  organicLayer = createGraphics(width, height);
  organicLayer.colorMode(HSB, 360, 100, 100, 100);
  organicLayer.pixelDensity(1);

  machineLayer = createGraphics(width, height);
  machineLayer.colorMode(HSB, 360, 100, 100, 100);
  machineLayer.pixelDensity(1);

  latticeLayer = createGraphics(width, height);
  latticeLayer.colorMode(HSB, 360, 100, 100, 100);
  latticeLayer.pixelDensity(1);

  bloomLayer = createGraphics(width, height);
  bloomLayer.colorMode(HSB, 360, 100, 100, 100);
  bloomLayer.pixelDensity(1);

  applySeed(CONFIG.seed);
  initWorld();

  for (let i = 0; i < CONFIG.burnInFrames; i++) simulateStep();
  loop();
}

function applySeed(seed) {
  CONFIG.seed = seed;
  randomSeed(seed);
  noiseSeed(seed);
  document.getElementById('seed').textContent = seed;
}

function initWorld() {
  horizonY = height * CONFIG.horizonRatio;

  organicLayer.background(240, 55, 5);
  machineLayer.background(240, 55, 5, 0); // transparent
  latticeLayer.clear();
  bloomLayer.clear();

  organics = [];
  for (let i = 0; i < CONFIG.organicCount; i++) {
    organics.push(new Organic());
  }

  machineRoots = [];
  let spacing = width / (CONFIG.machineRoots + 1);
  for (let i = 0; i < CONFIG.machineRoots; i++) {
    let x = spacing * (i + 1) + random(-spacing * 0.25, spacing * 0.25);
    machineRoots.push(new MachineRoot(x));
  }
}

function simulateStep() {
  t += 0.003;

  // --- organic trail layer fade ---
  organicLayer.noStroke();
  organicLayer.fill(240, 55, 5, 2.2);
  organicLayer.rect(0, 0, width, height);

  // --- machine layer fade ---
  machineLayer.noStroke();
  machineLayer.fill(240, 55, 5, 1.8);
  machineLayer.rect(0, 0, width, height);

  // --- bloom layer fade ---
  bloomLayer.noStroke();
  bloomLayer.fill(240, 55, 5, 3.0);
  bloomLayer.rect(0, 0, width, height);

  // --- update & draw organic stream ---
  for (let p of organics) {
    p.update();
    p.display(organicLayer, bloomLayer);
  }

  // --- draw machine presence ---
  for (let root of machineRoots) {
    root.display(machineLayer, bloomLayer);
  }

  // --- draw shared lattice at horizon ---
  drawLattice(latticeLayer, bloomLayer);
}

function draw() {
  if (CONFIG.paused) return;
  simulateStep();

  // --- composite ---
  background(240, 55, 5);

  // subtle vignette base
  noStroke();
  for (let r = 1.0; r >= 0; r -= 0.05) {
    let b = map(r, 0, 1, 2, 8);
    fill(240, 60, b, 4);
    ellipse(width / 2, height / 2, width * r, height * r);
  }

  image(organicLayer, 0, 0);
  image(machineLayer, 0, 0);

  // lattice layer drawn fresh each frame on top
  latticeLayer.clear();
  drawLattice(latticeLayer, bloomLayer);
  image(latticeLayer, 0, 0);

  // bloom additive
  blendMode(ADD);
  image(bloomLayer, 0, 0);
  blendMode(BLEND);

  // horizon glow bar
  let pulse = (sin(t * 2.4) + 1) / 2;
  let h = lerp(28, 195, pulse);
  noStroke();
  for (let i = 0; i < 24; i++) {
    let alpha = map(i, 0, 24, 8, 0);
    let y = horizonY + map(i, 0, 24, -40, 40);
    fill(h, 65, 95, alpha);
    rect(0, y - 1, width, 2);
  }
}

function drawLattice(layer, bloom) {
  let pulse = (sin(t * 2.2) + 1) / 2;
  let h = lerp(24, 200, pulse); // warm amber <-> cool cyan
  let s = 72;
  let br = 88 + pulse * 10;

  layer.strokeWeight(1.2);
  layer.stroke(h, s, br, 35 + pulse * 35);
  layer.line(0, horizonY, width, horizonY);

  // vertical lattice lines with wave
  let spacing = 48 + pulse * 28;
  let offset = (t * 14) % spacing;
  for (let x = -spacing; x < width + spacing; x += spacing) {
    let xpos = x + offset;
    let waver = sin(xpos * 0.015 + t * 4) * 18;
    layer.stroke(h, s, br, 18 + pulse * 22);
    layer.line(xpos, horizonY - 70 + waver, xpos, horizonY + 70 + waver);

    // node glow
    bloom.noStroke();
    bloom.fill(h, 55, 100, 5 + pulse * 5);
    bloom.ellipse(xpos, horizonY + waver * 0.3, 14 + pulse * 18, 14 + pulse * 18);
  }

  // cross-connections
  layer.strokeWeight(0.6);
  for (let x = -spacing; x < width + spacing; x += spacing * 2) {
    let x1 = x + offset;
    let x2 = x1 + spacing;
    let y1 = horizonY - 35 + sin(x1 * 0.02 + t * 3) * 12;
    let y2 = horizonY + 35 + sin(x2 * 0.02 + t * 3) * 12;
    layer.stroke(h, s, br, 12 + pulse * 15);
    layer.line(x1, y1, x2, y2);
  }
}

function mousePressed() {
  for (let p of organics) {
    let d = dist(mouseX, mouseY, p.pos.x, p.pos.y);
    if (d < 140) {
      let push = p5.Vector.sub(p.pos, createVector(mouseX, mouseY));
      push.setMag(random(1, 3));
      p.vel.add(push);
    }
  }
}

function keyPressed() {
  if (key === 's' || key === 'S') saveCanvas(`The-Becoming-${CONFIG.seed}`, 'png');
  if (key === 'g' || key === 'G') saveGif(`The-Becoming-${CONFIG.seed}`, 5);
  if (key === 'r' || key === 'R') {
    applySeed(floor(random(1000000)));
    initWorld();
    for (let i = 0; i < CONFIG.burnInFrames; i++) simulateStep();
  }
  if (key === ' ') CONFIG.paused = !CONFIG.paused;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  horizonY = height * CONFIG.horizonRatio;
  organicLayer = recreateLayer(organicLayer);
  machineLayer = recreateLayer(machineLayer);
  latticeLayer = recreateLayer(latticeLayer);
  bloomLayer = recreateLayer(bloomLayer);
  initWorld();
}

function recreateLayer(old) {
  let g = createGraphics(width, height);
  g.colorMode(HSB, 360, 100, 100, 100);
  g.pixelDensity(1);
  g.image(old, 0, 0);
  return g;
}

// ============================================================
// ORGANIC CONSCIOUSNESS STREAM
// ============================================================
class Organic {
  constructor() {
    this.reset();
  }

  reset() {
    this.pos = createVector(random(width), random(-60, horizonY - 120));
    this.vel = createVector(0, random(0.4, 1.4));
    this.acc = createVector(0, 0);
    this.maxSpeed = random(0.9, 2.2);
    this.col = random(PALETTE.warm);
    this.sw = random(0.5, 2.0);
    this.history = [];
    this.histLen = floor(random(18, 44));
    this.phase = random(TWO_PI);
    this.noiseScale = random(0.0018, 0.0042);
    this.irregularity = random(0.5, 1.3);
  }

  update() {
    // organic meander
    let n = noise(this.pos.x * this.noiseScale, this.pos.y * this.noiseScale, t * 0.25 + this.phase);
    let angle = n * TWO_PI * 4 - PI;
    let meander = p5.Vector.fromAngle(angle).mult(0.06 * this.irregularity);
    this.acc.add(meander);

    // downward drift
    this.acc.y += 0.015;

    // pull toward center as horizon nears
    if (this.pos.y < horizonY - 40) {
      let toCenter = createVector(width / 2 - this.pos.x, horizonY - this.pos.y);
      let d = toCenter.mag();
      toCenter.normalize().mult(0.04 + 0.18 / (d * 0.008 + 1));
      this.acc.add(toCenter);
    }

    // at horizon: dissolve into lattice flow
    if (abs(this.pos.y - horizonY) < 55) {
      let latticeFlow = createVector(
        (noise(this.pos.y * 0.01, t * 1.5) - 0.5) * 2.5,
        random(-0.3, 0.3)
      );
      this.acc.add(latticeFlow.mult(0.35));
    }

    this.vel.add(this.acc);
    this.vel.limit(this.maxSpeed);
    this.pos.add(this.vel);
    this.acc.mult(0);

    this.history.push(this.pos.copy());
    if (this.history.length > this.histLen) this.history.shift();

    // respawn if it wanders too far below horizon or off-screen
    if (this.pos.y > horizonY + random(90, 220) || this.pos.x < -80 || this.pos.x > width + 80) {
      this.reset();
    }
  }

  display(layer, bloom) {
    let blend = 0;
    if (this.pos.y > horizonY - 80) {
      blend = map(this.pos.y, horizonY - 80, horizonY + 50, 0, 1, true);
    }

    layer.noFill();
    layer.beginShape();
    for (let i = 0; i < this.history.length; i++) {
      let p = this.history[i];
      let a = map(i, 0, this.history.length, 0, 50, true);
      let h = lerp(this.col.h, 195, blend);
      let s = lerp(this.col.s, 70, blend);
      let b = lerp(this.col.b, 78, blend);
      layer.stroke(h, s, b, a);
      layer.strokeWeight(this.sw * (1 - blend * 0.3));
      layer.curveVertex(p.x, p.y);
    }
    layer.endShape();

    // luminous core
    let gh = lerp(this.col.h, 190, blend);
    bloom.noStroke();
    bloom.fill(gh, 55, 100, 5);
    bloom.ellipse(this.pos.x, this.pos.y, this.sw * 7, this.sw * 7);
  }
}

// ============================================================
// MACHINE PRESENCE — recursive geometric growth
// ============================================================
class MachineRoot {
  constructor(x) {
    this.x = x;
    this.baseCol = random(PALETTE.cool);
    this.branches = [];
    this.generate(this.x, height + 20, -PI / 2, CONFIG.machineDepth + floor(random(-1, 2)), 130);
  }

  generate(x, y, angle, depth, len) {
    if (depth <= 0 || len < 6) return;
    let endX = x + cos(angle) * len;
    let endY = y + sin(angle) * len;

    this.branches.push({
      x, y, endX, endY, depth, angle, len,
      swayPhase: random(TWO_PI),
      hueShift: random(-12, 12)
    });

    let numSub = floor(random(2, 4));
    for (let i = 0; i < numSub; i++) {
      let spread = PI / 2.8;
      let newAngle = angle + random(-spread, spread);
      this.generate(endX, endY, newAngle, depth - 1, len * random(0.55, 0.72));
    }
  }

  display(layer, bloom) {
    for (let b of this.branches) {
      let tipY = b.endY + sin(t * 2 + b.swayPhase) * map(b.depth, 1, CONFIG.machineDepth, 2, 8);
      let dToHorizon = abs(tipY - horizonY);
      let blend = map(dToHorizon, 0, 110, 1, 0, true);

      // cool machine dissolves to warm near horizon
      let h = lerp(this.baseCol.h, 30, blend);
      let s = lerp(this.baseCol.s, 85, blend);
      let br = lerp(this.baseCol.b, 92, blend);
      let alpha = map(b.depth, 1, CONFIG.machineDepth, 35, 85);

      layer.strokeWeight(map(b.depth, 1, CONFIG.machineDepth, 0.6, 3.2));
      layer.stroke(h, s, br, alpha);
      layer.line(b.x, b.y, b.endX, tipY);

      // node at tip
      layer.noStroke();
      layer.fill(h, s, br, alpha + 15);
      layer.ellipse(b.endX, tipY, 2 + b.depth * 1.3, 2 + b.depth * 1.3);

      // geometric recursion markers (small squares)
      if (b.depth > 2) {
        layer.stroke(h, s, br, alpha * 0.5);
        layer.noFill();
        layer.rectMode(CENTER);
        layer.push();
        layer.translate(b.endX, tipY);
        layer.rotate(angleFromVector(b.endX - b.x, tipY - b.y));
        layer.rect(0, 0, b.len * 0.25, b.len * 0.25);
        layer.pop();
      }

      // bloom near horizon
      if (tipY < horizonY + 80 && tipY > horizonY - 60) {
        bloom.noStroke();
        bloom.fill(h, 45, 100, 5);
        bloom.ellipse(b.endX, tipY, 18, 18);
      }
    }
  }
}

function angleFromVector(x, y) {
  return atan2(y, x);
}
</script>
</body>
</html>
