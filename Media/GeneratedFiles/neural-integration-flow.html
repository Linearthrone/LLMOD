<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayleigh <> Victoria — Neural Integration Flow</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #05050a;
      overflow: hidden;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: absolute;
      bottom: 18px;
      left: 24px;
      color: #a29bfe;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      opacity: 0.65;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="overlay">KAYLEIGH  <>  HOUSE VICTORIA  |  INTEGRATION</div>

  <script>
    let nodes = [];
    let particles = [];
    let nGrid = 9;
    let seed = 2026;
    let w, h, cx, cy;
    let leftAttractor, rightAttractor;

    function setup() {
      randomSeed(seed);
      noiseSeed(seed);
      w = windowWidth;
      h = windowHeight;
      createCanvas(w, h).parent('canvas-container');
      colorMode(HSB, 360, 100, 100, 100);
      cx = w / 2;
      cy = h / 2;
      leftAttractor = createVector(w * 0.28, cy);
      rightAttractor = createVector(w * 0.72, cy);
      buildNetwork();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      w = windowWidth;
      h = windowHeight;
      cx = w / 2;
      cy = h / 2;
      leftAttractor.set(w * 0.28, cy);
      rightAttractor.set(w * 0.72, cy);
      nodes = [];
      particles = [];
      buildNetwork();
    }

    function buildNetwork() {
      // organic nodes on the left (biological consciousness)
      for (let i = 0; i < nGrid; i++) {
        for (let j = 0; j < nGrid; j++) {
          let x = map(i, 0, nGrid - 1, w * 0.05, w * 0.35);
          let y = map(j, 0, nGrid - 1, h * 0.15, h * 0.85);
          let d = dist(x, y, leftAttractor.x, leftAttractor.y);
          if (noise(i * 0.7, j * 0.7) > 0.42 && d < h * 0.35) {
            nodes.push(new Node(x, y, 'bio'));
          }
        }
      }
      // synthetic nodes on the right (neural substrate)
      for (let i = 0; i < nGrid; i++) {
        for (let j = 0; j < nGrid; j++) {
          let x = map(i, 0, nGrid - 1, w * 0.65, w * 0.95);
          let y = map(j, 0, nGrid - 1, h * 0.15, h * 0.85);
          let d = dist(x, y, rightAttractor.x, rightAttractor.y);
          if (noise(i * 0.8 + 50, j * 0.8 + 50) > 0.4 && d < h * 0.35) {
            nodes.push(new Node(x, y, 'synth'));
          }
        }
      }
      // bridge seed particles
      for (let i = 0; i < 180; i++) {
        particles.push(new Particle());
      }
    }

    function draw() {
      background(230, 60, 4, 100);
      noStroke();

      // ambient pulsing fields
      drawAmbience();

      // draw tendrils between nearby nodes
      for (let n of nodes) {
        n.update();
        n.display();
      }

      // draw flowing particles between hemispheres
      for (let p of particles) {
        p.update();
        p.display();
      }

      // central integration nexus
      drawNexus();

      // mouse influence
      if (mouseX > 0 && mouseX < w && mouseY > 0 && mouseY < h) {
        strokeWeight(1.5);
        stroke(280, 70, 90, 12);
        noFill();
        ellipse(mouseX, mouseY, 60 + sin(frameCount * 0.08) * 10);
      }
    }

    function drawAmbience() {
      let t = frameCount * 0.005;
      for (let a = 0; a < 360; a += 12) {
        let rad = map(noise(a * 0.05, t), 0, 1, h * 0.2, h * 0.55);
        let x = cx + cos(radians(a + frameCount * 0.1)) * rad;
        let y = cy + sin(radians(a + frameCount * 0.15)) * rad * 0.6;
        fill(255, 10, 90, 1.2);
        ellipse(x, y, 220, 220);
      }
    }

    function drawNexus() {
      let pulse = 1 + sin(frameCount * 0.06) * 0.12;
      noFill();
      strokeWeight(2);
      stroke(280, 85, 98, 25);
      ellipse(cx, cy, 160 * pulse, 160 * pulse);
      stroke(280, 85, 98, 14);
      ellipse(cx, cy, 240 * pulse, 240 * pulse);

      // inner core
      noStroke();
      fill(280, 50, 100, 70);
      ellipse(cx, cy, 36 * pulse, 36 * pulse);
      fill(280, 20, 100, 90);
      ellipse(cx, cy, 16, 16);
    }

    class Node {
      constructor(x, y, kind) {
        this.base = createVector(x, y);
        this.pos = createVector(x, y);
        this.kind = kind;
        this.radius = random(3.5, 7.5);
        this.phase = random(TWO_PI);
        this.pulseSpeed = random(0.03, 0.07);
        if (kind === 'bio') {
          this.hue = random(8, 32);     // warm organic amber/coral
          this.sat = random(70, 95);
          this.bri = random(70, 95);
        } else {
          this.hue = random(190, 240); // cool electric cyan/violet
          this.sat = random(60, 90);
          this.bri = random(75, 100);
        }
      }

      update() {
        let nX = noise(this.base.x * 0.005, this.base.y * 0.005, frameCount * 0.004) - 0.5;
        let nY = noise(this.base.x * 0.005 + 100, this.base.y * 0.005 + 100, frameCount * 0.004) - 0.5;
        this.pos.x = this.base.x + nX * 40;
        this.pos.y = this.base.y + nY * 40;
      }

      display() {
        let glow = this.radius * (2.2 + sin(this.phase + frameCount * this.pulseSpeed) * 0.5);
        noStroke();
        fill(this.hue, this.sat * 0.6, this.bri, 14);
        ellipse(this.pos.x, this.pos.y, glow * 2.5, glow * 2.5);
        fill(this.hue, this.sat, this.bri, 55);
        ellipse(this.pos.x, this.pos.y, glow, glow);
        fill(0, 0, 100, 80);
        ellipse(this.pos.x, this.pos.y, this.radius * 0.55, this.radius * 0.55);

        // connect to neighbors within range
        for (let other of nodes) {
          if (other === this) continue;
          let d = p5.Vector.dist(this.pos, other.pos);
          let maxD = this.kind === other.kind ? 120 : 160;
          if (d < maxD) {
            let alpha = map(d, 0, maxD, 24, 0);
            let midHue = (this.hue + other.hue) / 2;
            stroke(midHue, 75, 95, alpha);
            strokeWeight(map(d, 0, maxD, 1.6, 0.4));
            line(this.pos.x, this.pos.y, other.pos.x, other.pos.y);
          }
        }
      }
    }

    class Particle {
      constructor() {
        this.reset(true);
      }

      reset(randomStart = false) {
        this.side = random() < 0.5 ? 'left' : 'right';
        this.life = random(120, 320);
        this.maxLife = this.life;
        if (this.side === 'left') {
          let y = random(h * 0.2, h * 0.8);
          this.pos = createVector(randomStart ? random(w * 0.05, w * 0.45) : w * 0.12, y);
          this.target = rightAttractor;
          this.hue = random(18, 38);
        } else {
          let y = random(h * 0.2, h * 0.8);
          this.pos = createVector(randomStart ? random(w * 0.55, w * 0.95) : w * 0.88, y);
          this.target = leftAttractor;
          this.hue = random(200, 260);
        }
        this.vel = createVector(0, 0);
        this.acc = createVector(0, 0);
        this.maxSpeed = random(1.8, 3.2);
        this.maxForce = 0.12;
        this.radius = random(1.5, 3.2);
        this.completed = false;
      }

      update() {
        // seek target
        let desired = p5.Vector.sub(this.target, this.pos);
        let d = desired.mag();
        desired.normalize();
        let speed = this.maxSpeed;
        if (d < 120) {
          speed = map(d, 0, 120, 0.6, this.maxSpeed);
        }
        desired.mult(speed);
        let steer = p5.Vector.sub(desired, this.vel);
        steer.limit(this.maxForce);
        this.acc.add(steer);

        // organic drift via curl-ish noise
        let angle = noise(this.pos.x * 0.006, this.pos.y * 0.006, frameCount * 0.008) * TWO_PI * 2;
        let drift = p5.Vector.fromAngle(angle);
        drift.mult(0.18);
        this.acc.add(drift);

        // mouse repulsion / attraction
        let mouse = createVector(mouseX, mouseY);
        let md = p5.Vector.dist(this.pos, mouse);
        if (md < 160) {
          let push = p5.Vector.sub(this.pos, mouse);
          push.normalize();
          push.mult(map(md, 0, 160, 0.35, 0));
          this.acc.add(push);
        }

        this.vel.add(this.acc);
        this.vel.limit(this.maxSpeed);
        this.pos.add(this.vel);
        this.acc.mult(0);
        this.life--;

        // cross-fade hue toward integration purple at center
        let centerDist = dist(this.pos.x, this.pos.y, cx, cy);
        if (centerDist < w * 0.18) {
          this.hue = lerp(this.hue, 275, 0.04);
        }

        if (d < 25 || this.life <= 0 || this.pos.x < -20 || this.pos.x > w + 20 || this.pos.y < -20 || this.pos.y > h + 20) {
          this.completed = true;
          // spawn a fresh bridge particle from the opposite side to keep flow continuous
          this.reset();
        }
      }

      display() {
        let lifeRatio = this.life / this.maxLife;
        let alpha = lifeRatio < 0.25 ? map(lifeRatio, 0, 0.25, 0, 60) : 60;
        noStroke();
        fill(this.hue, 80, 100, alpha * 0.35);
        ellipse(this.pos.x, this.pos.y, this.radius * 4, this.radius * 4);
        fill(this.hue, 40, 100, alpha);
        ellipse(this.pos.x, this.pos.y, this.radius, this.radius);

        // small trail
        let trail = this.vel.copy().mult(-6);
        let tail = p5.Vector.add(this.pos, trail);
        stroke(this.hue, 70, 95, alpha * 0.5);
        strokeWeight(this.radius * 0.6);
        line(this.pos.x, this.pos.y, tail.x, tail.y);
      }
    }

    function mousePressed() {
      // click to emit a burst of integration particles from the nexus
      for (let i = 0; i < 24; i++) {
        let p = new Particle();
        p.pos = createVector(cx + random(-20, 20), cy + random(-20, 20));
        let angle = random(TWO_PI);
        p.vel = p5.Vector.fromAngle(angle).mult(random(2, 5));
        p.target = random() < 0.5 ? leftAttractor : rightAttractor;
        p.hue = 275;
        particles.push(p);
      }
      if (particles.length > 320) {
        particles.splice(0, particles.length - 320);
      }
    }
  </script>
</body>
</html>
