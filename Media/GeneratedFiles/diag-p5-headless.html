<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style> body { margin:0; background:#0d0b18; } </style>
</head>
<body>
<script>
function setup() {
  createCanvas(800, 600);
  colorMode(HSB, 360, 100, 100, 100);
  background(250, 60, 20);
  fill(35, 90, 95);
  noStroke();
  rect(300, 200, 200, 200);
  fill(250, 20, 98);
  ellipse(700, 100, 80, 80);
}
</script>
</body>
</html>
