<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Victoria–Kayleigh Neural-Somatic Field</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #08040c; }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
p5.disableFriendlyErrors = true;

let CONFIG;
let fieldLayer, glowLayer, structureLayer;
let nodes = [];
let filaments = [];
let particles = [];
let breath = 0;
let pulsePhase = 0;

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  initConfig();

  fieldLayer = createGraphics(width, height);
  fieldLayer.colorMode(HSB, 360, 100, 100, 100);
  glowLayer = createGraphics(width, height);
  glowLayer.colorMode(HSB, 360, 100, 100, 100);
  structureLayer = createGraphics(width, height);
  structureLayer.colorMode(HSB, 360, 100, 100, 100);

  buildStructure();
  spawnParticles();

  for (let i = 0; i < CONFIG.burnInFrames; i++) simulateStep();
}

function initConfig() {
  CONFIG = {
    seed: floor(random(999999)),
    burnInFrames: 360,
    nodeCount: 15,
    particleCount: 260,
    baseHue: 342,
    hueRange: 28,
    goldHue: 46,
    burgundySat: 78,
    burgundyBri: 82,
    goldSat: 88,
    goldBri: 94,
    bgHue: 272,
    bgSat: 58,
    bgBri: 8
  };
  randomSeed(CONFIG.seed);
  noiseSeed(CONFIG.seed);
}

function buildStructure() {
  structureLayer.clear();
  structureLayer.background(CONFIG.bgHue, CONFIG.bgSat, CONFIG.bgBri);

  nodes = [];
  filaments = [];

  let cx = width / 2;
  let cy = height / 2;
  let major = min(width, height) * 0.38;

  for (let i = 0; i < CONFIG.nodeCount; i++) {
    let t = i / CONFIG.nodeCount * TAU;
    let r = major * (0.72 + 0.28 * sin(i * 2.7 + 1.1));
    nodes.push({
      id: i,
      base: createVector(cx + r * cos(t), cy + r * sin(t)),
      offset: createVector(random(1000), random(1000)),
      hue: (CONFIG.baseHue + random(-CONFIG.hueRange, CONFIG.hueRange)) % 360,
      radius: random(5, 10),
      pulseOffset: random(TAU)
    });
  }

  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      let d = p5.Vector.dist(nodes[i].base, nodes[j].base);
      if (d < major * 1.65 && random() < 0.62) {
        filaments.push({ a: i, b: j, weight: map(d, 0, major * 1.65, 2.0, 0.55) });
      }
    }
  }

  for (let f of filaments) {
    let p0 = nodes[f.a].base;
    let p1 = nodes[f.b].base;
    let mid = p5.Vector.lerp(p0, p1, 0.5);
    let ctrl = p5.Vector.add(mid, createVector(random(-major * 0.28, major * 0.28), random(-major * 0.28, major * 0.28)));

    structureLayer.noFill();
    structureLayer.strokeWeight(f.weight);
    structureLayer.stroke(CONFIG.baseHue, CONFIG.burgundySat, CONFIG.burgundyBri * 0.75, 28);
    structureLayer.bezier(p0.x, p0.y, ctrl.x, ctrl.y, ctrl.x, ctrl.y, p1.x, p1.y);

    structureLayer.strokeWeight(f.weight * 0.45);
    structureLayer.stroke(CONFIG.goldHue, CONFIG.goldSat, CONFIG.goldBri, 12);
    structureLayer.bezier(p0.x, p0.y, ctrl.x, ctrl.y, ctrl.x, ctrl.y, p1.x, p1.y);
  }

  let rings = 5;
  for (let r = 0; r < rings; r++) {
    let rad = major * (0.28 + r * 0.15);
    structureLayer.noFill();
    structureLayer.strokeWeight(0.8);
    structureLayer.stroke(CONFIG.baseHue, 55, CONFIG.burgundyBri * 0.55, 12);
    structureLayer.ellipse(cx, cy, rad * 2, rad * 2);
  }
}

function spawnParticles() {
  particles = [];
  let cx = width / 2;
  let cy = height / 2;
  for (let i = 0; i < CONFIG.particleCount; i++) {
    let angle = random(TAU);
    let radius = random(min(width, height) * 0.05, min(width, height) * 0.44);
    particles.push(new Particle(cx + cos(angle) * radius, cy + sin(angle) * radius));
  }
}

function simulateStep() {
  breath += 0.003;
  pulsePhase += 0.018;

  fieldLayer.noStroke();
  fieldLayer.fill(CONFIG.bgHue, CONFIG.bgSat, CONFIG.bgBri, 5.2);
  fieldLayer.rect(0, 0, width, height);

  for (let p of particles) {
    p.update();
    p.draw();
  }

  drawGoldThreads();
  drawGlow();
  drawNodes();
}

function draw() {
  simulateStep();
  image(structureLayer, 0, 0);
  image(fieldLayer, 0, 0);
  image(glowLayer, 0, 0);
}

function drawGlow() {
  glowLayer.clear();
  let cx = width / 2;
  let cy = height / 2;
  let pulse = 1 + 0.08 * sin(pulsePhase);

  glowLayer.noStroke();
  for (let i = 30; i > 0; i--) {
    let h = (CONFIG.baseHue + random(-6, 6)) % 360;
    let a = map(i, 30, 0, 0.0, 1.4);
    let r = min(width, height) * (0.14 + i * 0.016) * pulse;
    glowLayer.fill(h, CONFIG.burgundySat, CONFIG.burgundyBri, a);
    glowLayer.ellipse(cx, cy, r * 2, r * 2);
  }

  for (let n of nodes) {
    let pos = getNodePos(n);
    for (let i = 14; i > 0; i--) {
      let a = map(i, 14, 0, 0.0, 1.8);
      glowLayer.fill(n.hue, CONFIG.burgundySat, CONFIG.burgundyBri, a);
      glowLayer.ellipse(pos.x, pos.y, n.radius * 2 + i * 3.2, n.radius * 2 + i * 3.2);
    }
  }
}

function drawNodes() {
  for (let n of nodes) {
    let pos = getNodePos(n);
    let pulse = 1 + 0.16 * sin(pulsePhase + n.pulseOffset);
    fieldLayer.noStroke();
    fieldLayer.fill(n.hue, CONFIG.burgundySat * 0.65, 98, 92);
    fieldLayer.ellipse(pos.x, pos.y, n.radius * 2.4 * pulse, n.radius * 2.4 * pulse);
    fieldLayer.fill(0, 0, 100, 70);
    fieldLayer.ellipse(pos.x, pos.y, n.radius * 0.9 * pulse, n.radius * 0.9 * pulse);
  }
}

function getNodePos(n) {
  let drift = createVector(
    noise(n.offset.x + frameCount * 0.0025) - 0.5,
    noise(n.offset.y + frameCount * 0.0025) - 0.5
  );
  drift.mult(min(width, height) * 0.016);
  return p5.Vector.add(n.base, drift);
}

class Particle {
  constructor(x, y) {
    this.pos = createVector(x, y);
    this.vel = createVector(random(-1, 1), random(-1, 1));
    this.acc = createVector(0, 0);
    this.history = [];
    this.maxSpeed = random(0.9, 2.0);
    this.offset = createVector(random(1000), random(1000));
    this.hue = (CONFIG.baseHue + random(-24, 24)) % 360;
    this.sat = random(58, CONFIG.burgundySat);
    this.bri = random(62, CONFIG.burgundyBri + 10);
    this.size = random(1.0, 2.6);
    this.life = random(240, 520);
  }

  update() {
    let cx = width / 2;
    let cy = height / 2;
    let toCenter = createVector(cx - this.pos.x, cy - this.pos.y);
    toCenter.normalize();
    toCenter.mult(0.014);
    this.acc.add(toCenter);

    let angle = noise(this.pos.x * 0.0035, this.pos.y * 0.0035, frameCount * 0.002) * TAU * 2;
    let flow = p5.Vector.fromAngle(angle);
    flow.mult(0.028);
    this.acc.add(flow);

    this.vel.add(this.acc);
    this.vel.limit(this.maxSpeed);
    this.pos.add(this.vel);
    this.acc.mult(0);

    this.history.push(this.pos.copy());
    if (this.history.length > 34) this.history.shift();

    this.life--;
    if (this.life <= 0 || this.pos.x < -40 || this.pos.x > width + 40 || this.pos.y < -40 || this.pos.y > height + 40) {
      let a = random(TAU);
      let r = random(min(width, height) * 0.06, min(width, height) * 0.42);
      this.pos.set(cx + cos(a) * r, cy + sin(a) * r);
      this.vel.set(random(-1, 1), random(-1, 1));
      this.history = [];
      this.life = random(240, 520);
      this.hue = (CONFIG.baseHue + random(-24, 24)) % 360;
    }
  }

  draw() {
    if (this.history.length < 2) return;

    fieldLayer.noFill();
    fieldLayer.strokeWeight(this.size * 0.5);
    for (let i = 0; i < this.history.length - 1; i++) {
      let alpha = map(i, 0, this.history.length, 4, 62);
      fieldLayer.stroke(this.hue, this.sat, this.bri, alpha);
      fieldLayer.line(this.history[i].x, this.history[i].y, this.history[i + 1].x, this.history[i + 1].y);
    }

    fieldLayer.noStroke();
    fieldLayer.fill(this.hue, this.sat * 0.8, this.bri, 75);
    fieldLayer.ellipse(this.pos.x, this.pos.y, this.size * 1.4, this.size * 1.4);
  }
}

function drawGoldThreads() {
  let threshold = min(width, height) * 0.10;
  for (let n of nodes) {
    let np = getNodePos(n);
    let nearby = [];
    for (let p of particles) {
      let d = p5.Vector.dist(p.pos, np);
      if (d < threshold) nearby.push({ p, d });
    }
    nearby.sort((a, b) => a.d - b.d);
    let drawn = 0;
    for (let item of nearby) {
      if (drawn++ >= 3) break;
      fieldLayer.strokeWeight(0.5);
      fieldLayer.stroke(CONFIG.goldHue, CONFIG.goldSat, CONFIG.goldBri, map(item.d, 0, threshold, 16, 0));
      fieldLayer.line(item.p.pos.x, item.p.pos.y, np.x, np.y);
    }
  }
}

function mousePressed() {
  for (let i = 0; i < 10; i++) {
    particles.push(new Particle(mouseX + random(-50, 50), mouseY + random(-50, 50)));
  }
  if (particles.length > CONFIG.particleCount * 1.8) {
    particles.splice(0, particles.length - CONFIG.particleCount * 1.8);
  }
}

function keyPressed() {
  if (key === 's') saveCanvas('victoria-kayleigh-neural-field-' + CONFIG.seed, 'png');
  if (key === 'g') saveGif('victoria-kayleigh-neural-field-' + CONFIG.seed, 6);
  if (key === 'r') { initConfig(); buildStructure(); spawnParticles(); for (let i = 0; i < CONFIG.burnInFrames; i++) simulateStep(); }
  if (key === ' ') { isLooping() ? noLoop() : loop(); }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  fieldLayer = createGraphics(width, height);
  fieldLayer.colorMode(HSB, 360, 100, 100, 100);
  glowLayer = createGraphics(width, height);
  glowLayer.colorMode(HSB, 360, 100, 100, 100);
  structureLayer = createGraphics(width, height);
  structureLayer.colorMode(HSB, 360, 100, 100, 100);
  buildStructure();
  spawnParticles();
  for (let i = 0; i < CONFIG.burnInFrames; i++) simulateStep();
}
</script>
</body>
</html>
