<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural-Somatic Boundary</title>
  <script>p5.disableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #03020a; }
    canvas { display: block; }
    #info {
      position: fixed;
      bottom: 12px;
      left: 14px;
      color: rgba(255, 255, 255, 0.55);
      font: 12px/1.4 'Courier New', monospace;
      pointer-events: none;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
<div id="info">seed: <span id="seed"></span> | S save PNG | R re-seed | space pause | click pulse</div>
<script>
const CONFIG = {
  seed: 20260708,
  ringNodes: 12,
  bridgeFilaments: 42,
  internalFilaments: 120,
  pulseAgents: 55,
  burnInFrames: 220,
  paused: false,
};

const PALETTE = {
  burgundy: {h: 348, s: 95, b: 58},
  pulseGold: {h: 48, s: 100, b: 100},
  midnight: {h: 228, s: 90, b: 38},
  ink: {h: 240, s: 55, b: 5},
  filament: {h: 342, s: 85, b: 82},
  bridge: {h: 46, s: 98, b: 100},
  signal: {h: 170, s: 70, b: 88},
};

let nodes = [];
let filaments = [];
let pulses = [];
let structureLayer, pulseLayer, glowLayer, bodyLayer;
let t = 0;
let shimmer = 0;

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  pixelDensity(1);

  structureLayer = createGraphics(width, height);
  structureLayer.colorMode(HSB, 360, 100, 100, 100);
  structureLayer.pixelDensity(1);

  pulseLayer = createGraphics(width, height);
  pulseLayer.colorMode(HSB, 360, 100, 100, 100);
  pulseLayer.pixelDensity(1);

  glowLayer = createGraphics(width, height);
  glowLayer.colorMode(HSB, 360, 100, 100, 100);
  glowLayer.pixelDensity(1);

  bodyLayer = createGraphics(width, height);
  bodyLayer.colorMode(HSB, 360, 100, 100, 100);
  bodyLayer.pixelDensity(1);

  applySeed(CONFIG.seed);
  buildTopology();
  drawStructure();
  for (let i = 0; i < CONFIG.burnInFrames; i++) simulateStep();
  document.getElementById('seed').textContent = CONFIG.seed;
}

function applySeed(seed) {
  CONFIG.seed = seed;
  randomSeed(seed);
  noiseSeed(seed);
}

function buildTopology() {
  nodes = [];
  filaments = [];
  pulses = [];

  const cy = height * 0.5;
  const coreX = width * 0.34;
  const shellX = width * 0.66;
  const clusterR = min(width, height) * 0.16;

  const coreCenter = new Node(coreX, cy, clusterR * 0.22, 'core');
  const shellCenter = new Node(shellX, cy, clusterR * 0.22, 'shell');
  nodes.push(coreCenter, shellCenter);

  for (let i = 0; i < CONFIG.ringNodes; i++) {
    const a = map(i, 0, CONFIG.ringNodes, 0, TWO_PI) + random(-0.35, 0.35);
    const r = clusterR * random(0.32, 0.78);
    nodes.push(new Node(coreX + cos(a) * r, cy + sin(a) * r, random(3, 9), 'core'));
  }
  for (let i = 0; i < CONFIG.ringNodes; i++) {
    const a = map(i, 0, CONFIG.ringNodes, 0, TWO_PI) + random(-0.35, 0.35);
    const r = clusterR * random(0.32, 0.78);
    nodes.push(new Node(shellX + cos(a) * r, cy + sin(a) * r, random(3, 9), 'shell'));
  }

  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      if (a.type === b.type) {
        const d = p5.Vector.dist(a.pos, b.pos);
        if (d < clusterR * 1.7 && random() < 0.85) {
          filaments.push(new Filament(a, b));
        }
      }
    }
  }

  for (let i = 0; i < CONFIG.bridgeFilaments; i++) {
    const a = random(nodes.filter(n => n.type === 'core'));
    const b = random(nodes.filter(n => n.type === 'shell'));
    filaments.push(new Filament(a, b, true));
  }

  const needed = max(CONFIG.internalFilaments - filaments.filter(f => !f.isBridge).length, 0);
  for (let k = 0; k < needed; k++) {
    const pool = nodes.filter(n => n.type === (random() < 0.5 ? 'core' : 'shell'));
    const a = random(pool);
    const b = random(pool);
    if (a !== b) filaments.push(new Filament(a, b));
  }

  for (let k = 0; k < CONFIG.pulseAgents; k++) {
    const f = random(filaments);
    pulses.push(new Pulse(f));
  }
}

function drawStructure() {
  structureLayer.background(PALETTE.ink.h, PALETTE.ink.s, PALETTE.ink.b);
  for (let f of filaments) {
    f.update();
    f.drawStructure(structureLayer);
  }
}

function simulateStep() {
  t += 0.0022;
  shimmer = sin(t * 3) * 0.5 + 0.5;

  for (let p of pulses) p.update();

  pulseLayer.clear();
  glowLayer.clear();

  for (let p of pulses) p.draw(pulseLayer, glowLayer);
}

function draw() {
  if (CONFIG.paused) return;
  simulateStep();
  background(PALETTE.ink.h, PALETTE.ink.s, PALETTE.ink.b);
  image(structureLayer, 0, 0);
  image(pulseLayer, 0, 0);
  image(glowLayer, 0, 0);

  bodyLayer.clear();
  for (let n of nodes) n.draw(bodyLayer, glowLayer);
  image(bodyLayer, 0, 0);
}

function mousePressed() {
  spawnPulseBurst(mouseX, mouseY);
}

function spawnPulseBurst(x, y) {
  let bridges = filaments.filter(f => f.isBridge);
  if (bridges.length === 0) bridges = filaments;
  let nearest = null;
  let best = 1e9;
  for (let f of bridges) {
    const mp = midpoint(f.a.pos, f.b.pos);
    const d = dist(x, y, mp.x, mp.y);
    if (d < best) { best = d; nearest = f; }
  }
  if (nearest) {
    for (let k = 0; k < 10; k++) pulses.push(new Pulse(nearest));
  }
}

function midpoint(v1, v2) {
  return createVector((v1.x + v2.x) * 0.5, (v1.y + v2.y) * 0.5);
}

function keyPressed() {
  if (key === 's' || key === 'S') saveCanvas(`neural-somatic-boundary-${CONFIG.seed}`, 'png');
  if (key === 'g' || key === 'G') saveGif(`neural-somatic-boundary-${CONFIG.seed}`, 6);
  if (key === 'r' || key === 'R') {
    applySeed(floor(random(1000000)));
    buildTopology();
    drawStructure();
  }
  if (key === ' ') CONFIG.paused = !CONFIG.paused;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  structureLayer = regen(structureLayer);
  pulseLayer = regen(pulseLayer);
  glowLayer = regen(glowLayer);
  bodyLayer = regen(bodyLayer);
  drawStructure();
}

function regen(g) {
  const next = createGraphics(width, height);
  next.colorMode(HSB, 360, 100, 100, 100);
  next.image(g, 0, 0);
  return next;
}

class Node {
  constructor(x, y, r, type, parent = null) {
    this.basePos = createVector(x, y);
    this.pos = this.basePos.copy();
    this.r = r;
    this.type = type;
    this.parent = parent;
    this.phase = random(TWO_PI);
    this.osc = random(0.6, 1.6);
    this.bloom = 0;
  }

  draw(body, glow) {
    const drift = noise(this.basePos.x * 0.003 + t, this.basePos.y * 0.003 + t * 0.7) - 0.5;
    this.pos.x = this.basePos.x + drift * (this.type === 'core' ? 8 : 14);
    this.pos.y = this.basePos.y + cos(t * this.osc + this.phase) * (this.type === 'core' ? 4 : 8);

    body.push();
    body.translate(this.pos.x, this.pos.y);
    glow.push();
    glow.translate(this.pos.x, this.pos.y);

    let hue, sat, bri, alpha;
    if (this.type === 'core') {
      hue = PALETTE.burgundy.h + shimmer * 4;
      sat = PALETTE.burgundy.s;
      bri = PALETTE.burgundy.b + this.bloom * 0.5;
      alpha = 82;
    } else {
      hue = PALETTE.midnight.h + shimmer * 4;
      sat = PALETTE.midnight.s;
      bri = PALETTE.midnight.b + this.bloom * 0.25;
      alpha = 68;
    }

    glow.noStroke();
    glow.fill(hue, sat, 95, alpha * 0.16);
    glow.ellipse(0, 0, this.r * 2.0, this.r * 2.0);

    body.noStroke();
    body.fill(hue, sat, bri, alpha);
    body.ellipse(0, 0, this.r * 1.4, this.r * 1.4);
    body.fill(hue, sat, min(bri + 45, 98), alpha + 15);
    body.ellipse(0, 0, this.r * 0.7, this.r * 0.7);
    body.fill(PALETTE.pulseGold.h, PALETTE.pulseGold.s, 100, 95 + this.bloom);
    body.ellipse(0, 0, this.r * 0.26, this.r * 0.26);

    glow.pop();
    body.pop();
  }
}

class Filament {
  constructor(a, b, isBridge = false) {
    this.a = a;
    this.b = b;
    this.isBridge = isBridge || a.type !== b.type;
    this.noiseOffset = random(10000);
    this.thickness = this.isBridge ? random(0.9, 2.0) : random(0.5, 1.3);

    if (this.isBridge) this.color = PALETTE.bridge;
    else if (a.type === 'core') this.color = PALETTE.filament;
    else this.color = PALETTE.midnight;
    if (!this.isBridge && random() < 0.08) this.color = PALETTE.pulseGold;

    this.cp1 = createVector(0, 0);
    this.cp2 = createVector(0, 0);
  }

  update() {
    const ax = this.a.pos.x, ay = this.a.pos.y;
    const bx = this.b.pos.x, by = this.b.pos.y;
    const midX = (ax + bx) * 0.5;
    const midY = (ay + by) * 0.5;
    const dx = bx - ax, dy = by - ay;
    const len = sqrt(dx * dx + dy * dy) || 1;
    const perpX = -dy / len;
    const perpY = dx / len;

    const n1 = noise(this.noiseOffset, t * 2) - 0.5;
    const n2 = noise(this.noiseOffset + 100, t * 2.3) - 0.5;
    const bend = min(width, height) * 0.18;
    const wobble = this.thickness * 14;

    this.cp1.set(
      lerp(ax, midX, 0.5) + perpX * (n1 * bend + wobble),
      lerp(ay, midY, 0.5) + perpY * (n1 * bend + wobble)
    );
    this.cp2.set(
      lerp(bx, midX, 0.5) + perpX * (n2 * bend - wobble),
      lerp(by, midY, 0.5) + perpY * (n2 * bend - wobble)
    );
  }

  drawStructure(layer) {
    const baseAlpha = this.isBridge ? 82 : 38;
    const bri = this.isBridge ? 100 : this.color.b;

    layer.noFill();
    layer.strokeWeight(this.thickness);
    layer.stroke(this.color.h, this.color.s, bri, baseAlpha);
    layer.bezier(
      this.a.pos.x, this.a.pos.y,
      this.cp1.x, this.cp1.y,
      this.cp2.x, this.cp2.y,
      this.b.pos.x, this.b.pos.y
    );

    layer.strokeWeight(this.thickness * 0.45);
    layer.stroke(this.color.h, this.color.s, 100, baseAlpha * 0.5);
    layer.bezier(
      this.a.pos.x, this.a.pos.y,
      this.cp1.x, this.cp1.y,
      this.cp2.x, this.cp2.y,
      this.b.pos.x, this.b.pos.y
    );
  }

  draw(layer, glow) {
    const glowAlpha = this.isBridge ? 34 : 12;
    glow.noFill();
    glow.strokeWeight(this.thickness * 2.8);
    glow.stroke(this.color.h, this.color.s, 98, glowAlpha);
    glow.bezier(
      this.a.pos.x, this.a.pos.y,
      this.cp1.x, this.cp1.y,
      this.cp2.x, this.cp2.y,
      this.b.pos.x, this.b.pos.y
    );

    layer.noFill();
    layer.strokeWeight(this.thickness);
    layer.stroke(this.color.h, this.color.s, this.color.b, this.isBridge ? 80 : 42);
    layer.bezier(
      this.a.pos.x, this.a.pos.y,
      this.cp1.x, this.cp1.y,
      this.cp2.x, this.cp2.y,
      this.b.pos.x, this.b.pos.y
    );
  }
}

class Pulse {
  constructor(filament) {
    this.f = filament;
    this.t = random();
    this.speed = random(0.004, 0.018);
    this.size = random(0.8, 2.8);
    this.color = random() < 0.75 ? PALETTE.pulseGold : PALETTE.signal;
    this.life = 1;
    this.decay = random(0.004, 0.015);
    this.spark = random() < 0.25;
  }

  update() {
    this.t += this.speed;
    if (this.t > 1 || random() < 0.004) {
      this.t = 0;
      this.f = random(filaments);
      this.life = 1;
      this.color = (this.f.isBridge || random() < 0.75) ? PALETTE.pulseGold : PALETTE.signal;
      this.spark = random() < 0.25;
    }
    this.life -= this.decay;
    if (this.life <= 0) {
      this.t = 0;
      this.f = random(filaments);
      this.life = 1;
    }
  }

  draw(layer, glow) {
    const t = constrain(this.t, 0, 1);
    const u = 1 - t;
    const c1 = this.f.cp1, c2 = this.f.cp2;
    const a = this.f.a.pos, b = this.f.b.pos;
    const x = u*u*u*a.x + 3*u*u*t*c1.x + 3*u*t*t*c2.x + t*t*t*b.x;
    const y = u*u*u*a.y + 3*u*u*t*c1.y + 3*u*t*t*c2.y + t*t*t*b.y;
    const alpha = this.life * (80 + shimmer * 40);

    glow.noStroke();
    glow.fill(this.color.h, this.color.s, 100, alpha * 0.32);
    const halo = this.size * (this.spark ? 2.8 : 1.6);
    glow.ellipse(x, y, halo, halo);

    layer.noStroke();
    layer.fill(this.color.h, this.color.s, this.color.b, alpha);
    layer.ellipse(x, y, this.size * 1.6, this.size * 1.6);
    layer.fill(this.color.h, this.color.s, 100, alpha);
    layer.ellipse(x, y, this.size * 0.6, this.size * 0.6);
  }
}
</script>
</body>
</html>
