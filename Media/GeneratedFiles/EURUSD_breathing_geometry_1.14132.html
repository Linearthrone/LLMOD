<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EURUSD Breathing Geometry — Seed 1.14132</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141414;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const SEED = 1.14132;

    // Seeded PRNG — mulberry32
    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(Math.floor(SEED * 100000));

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let width, height, cx, cy;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      cx = width / 2;
      cy = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Muted palette
    const palette = {
      charcoal: ['#141414', '#1f1f1f', '#2b2b2b', '#363636'],
      burgundy: ['#4a1e24', '#5e2a30', '#72353c', '#8a4149'],
      gold:     ['#7d6a3e', '#9a824c', '#b89a5a', '#d4b268']
    };

    // Seed-derived structure
    const ringCount = 6 + Math.floor(rand() * 6);     // 6–11 rings
    const rings = [];
    for (let i = 0; i < ringCount; i++) {
      rings.push({
        baseRadius: 40 + i * 32 + rand() * 20,
        sides: 3 + Math.floor(rand() * 6),             // 3–8 sides
        rotationOffset: rand() * Math.PI * 2,
        direction: rand() > 0.5 ? 1 : -1,
        speed: 0.05 + rand() * 0.08,
        breathSpeed: 0.3 + rand() * 0.5,
        breathDepth: 8 + rand() * 18,
        phase: rand() * Math.PI * 2,
        colorGroup: rand() > 0.55 ? 'burgundy' : 'gold',
        alpha: 0.12 + rand() * 0.22,
        strokeWeight: 1 + rand() * 2.5
      });
    }

    const fieldRings = 12 + Math.floor(rand() * 8);
    const particles = [];
    for (let i = 0; i < 90; i++) {
      particles.push({
        angle: rand() * Math.PI * 2,
        dist: 60 + rand() * (Math.min(width, height) * 0.5),
        size: 1 + rand() * 2,
        pulse: rand() * Math.PI * 2,
        pulseSpeed: 0.2 + rand() * 0.6,
        colorGroup: rand() > 0.6 ? 'gold' : 'burgundy'
      });
    }

    function mixColor(group, idx, alpha) {
      const hex = palette[group][idx % palette[group].length];
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function drawPolygon(ctx, x, y, r, sides, rotation) {
      ctx.beginPath();
      for (let i = 0; i <= sides; i++) {
        const a = rotation + (i / sides) * Math.PI * 2;
        const px = x + Math.cos(a) * r;
        const py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    let t = 0;
    function frame(now) {
      const seconds = now / 1000;
      const dt = seconds - t;
      t = seconds;

      // Charcoal wash with slow drift
      const bgPulse = 0.5 + 0.5 * Math.sin(seconds * 0.07);
      ctx.fillStyle = `rgba(20, 20, 20, ${0.18 + bgPulse * 0.08})`;
      ctx.fillRect(0, 0, width, height);

      // Fine radial field — very subtle
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(seconds * 0.008);
      ctx.strokeStyle = mixColor('charcoal', 2, 0.04 + 0.03 * Math.sin(seconds * 0.12));
      ctx.lineWidth = 1;
      const maxR = Math.max(width, height) * 0.75;
      for (let i = 0; i < fieldRings; i++) {
        const r = 40 + i * (maxR / fieldRings) + Math.sin(seconds * 0.09 + i) * 6;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Particle dust
      for (const p of particles) {
        const pulse = 0.5 + 0.5 * Math.sin(seconds * p.pulseSpeed + p.pulse);
        const x = Math.cos(p.angle + seconds * 0.015) * p.dist;
        const y = Math.sin(p.angle + seconds * 0.015) * p.dist * 0.6;
        ctx.fillStyle = mixColor(p.colorGroup, Math.floor(seconds + p.angle), 0.08 + pulse * 0.12);
        ctx.beginPath();
        ctx.arc(x, y, p.size * (0.6 + pulse * 0.4), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Central breathing geometry
      ctx.save();
      ctx.translate(cx, cy);

      // Slow global rotation
      ctx.rotate(seconds * 0.018);

      for (let i = 0; i < rings.length; i++) {
        const r = rings[i];
        const breath = 1 + Math.sin(seconds * r.breathSpeed + r.phase) * (r.breathDepth / r.baseRadius);
        const radius = r.baseRadius * breath;
        const rotation = r.rotationOffset + seconds * r.speed * r.direction;

        const color = mixColor(r.colorGroup, i, r.alpha);
        ctx.strokeStyle = color;
        ctx.lineWidth = r.strokeWeight;

        // Outer glow trace
        ctx.shadowBlur = 0;
        drawPolygon(ctx, 0, 0, radius, r.sides, rotation);
        ctx.stroke();

        // Faint inner fill
        ctx.fillStyle = mixColor(r.colorGroup, i + 1, r.alpha * 0.35);
        ctx.fill();

        // Counter-rotating inner echo
        ctx.save();
        ctx.rotate(-seconds * r.speed * r.direction * 0.5);
        ctx.strokeStyle = mixColor(r.colorGroup, i + 2, r.alpha * 0.45);
        ctx.lineWidth = r.strokeWeight * 0.6;
        drawPolygon(ctx, 0, 0, radius * 0.92, r.sides, -rotation * 0.7);
        ctx.stroke();
        ctx.restore();
      }

      // Central core — slow heartbeat
      const heartbeat = 0.5 + 0.5 * Math.sin(seconds * 0.8);
      const coreR = 8 + heartbeat * 6;
      ctx.fillStyle = mixColor('gold', 0, 0.25 + heartbeat * 0.25);
      ctx.beginPath();
      ctx.arc(0, 0, coreR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = mixColor('burgundy', 1, 0.6);
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
