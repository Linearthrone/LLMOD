<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Victoria Sigil</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #07030a; }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
// House Victoria — Pulsing Sigil
// Burgundy hair, golden candles, heart-core
// Self-contained p5.js, seeded, dark atmospheric
p5.disableFriendlyErrors = true;

let CONFIG = {
  seed: 0,
  burnInFrames: 300,
  paused: false
};

let palette;
let structureLayer, pulseLayer, glowLayer, bodyLayer, coreLayer;
let nodes = [];
let filaments = [];
let pulses = [];
let candles = [];
let t = 0;
let heartRadius, cx, cy;

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  CONFIG.seed = floor(random(999999));
  randomSeed(CONFIG.seed);
  noiseSeed(CONFIG.seed);

  palette = {
    voidC:    { h: 260, s: 55, b: 7 },
    deepInk:  { h: 270, s: 45, b: 12 },
    burgundy: { h: 340, s: 72, b: 58 },
    wine:     { h: 335, s: 80, b: 35 },
    gold:     { h: 46,  s: 90, b: 98 },
    amber:    { h: 38,  s: 82, b: 85 },
    candleWick: { h: 45, s: 20, b: 90 }
  };

  cx = width / 2;
  cy = height / 2;
  heartRadius = min(width, height) * 0.09;

  structureLayer = createGraphics(width, height);
  pulseLayer = createGraphics(width, height);
  glowLayer = createGraphics(width, height);
  bodyLayer = createGraphics(width, height);
  coreLayer = createGraphics(width, height);

  [structureLayer, pulseLayer, glowLayer, bodyLayer, coreLayer].forEach(l => {
    l.colorMode(HSB, 360, 100, 100, 100);
    l.clear();
  });

  buildSigil();
  buildCandles();
  drawStructure();

  for (let i = 0; i < CONFIG.burnInFrames; i++) simulateStep();

  loop();
}

function buildSigil() {
  nodes = [];
  filaments = [];
  pulses = [];

  const innerCount = 9;
  const outerCount = 24;
  const midCount = 14;
  const r1 = min(width, height) * 0.16;
  const r2 = min(width, height) * 0.32;
  const r3 = min(width, height) * 0.46;

  // central heart node
  nodes.push({ x: cx, y: cy, r: heartRadius, type: 'core', hue: palette.burgundy.h });

  // inner ring
  for (let i = 0; i < innerCount; i++) {
    const a = map(i, 0, innerCount, 0, TAU) + random(-0.12, 0.12);
    nodes.push({ x: cx + cos(a) * r1, y: cy + sin(a) * r1, r: 4 + random(4), type: 'inner', hue: palette.wine.h });
  }

  // middle ring
  for (let i = 0; i < midCount; i++) {
    const a = map(i, 0, midCount, 0, TAU) + random(-0.18, 0.18);
    nodes.push({ x: cx + cos(a) * r2, y: cy + sin(a) * r2, r: 3 + random(4), type: 'mid', hue: palette.burgundy.h });
  }

  // outer ring
  for (let i = 0; i < outerCount; i++) {
    const a = map(i, 0, outerCount, 0, TAU) + random(-0.2, 0.2);
    nodes.push({ x: cx + cos(a) * r3, y: cy + sin(a) * r3, r: 2 + random(3), type: 'outer', hue: palette.wine.h });
  }

  // filaments: concentric rings + radial spokes + hair-like wandering strands
  for (let i = 1; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const ni = nodes[i];
      const nj = nodes[j];
      const d = dist(ni.x, ni.y, nj.x, nj.y);
      if (ni.type === nj.type && random() < 0.55 && d < min(width, height) * 0.18) {
        addFilament(i, j, ni.type === 'outer' ? 0.7 : 1.1, palette.wine);
      }
      // radial from core
      if ((ni.type === 'core' || nj.type === 'core') && random() < 0.42) {
        addFilament(i, j, 1.4, palette.burgundy);
      }
    }
  }

  // wandering hair strands beyond outer ring
  const hairCount = 48;
  for (let i = 0; i < hairCount; i++) {
    const a = random(TAU);
    const rStart = r3 + random(10, 50);
    const rEnd = r3 + random(min(width, height) * 0.18, min(width, height) * 0.42);
    const x1 = cx + cos(a) * rStart;
    const y1 = cy + sin(a) * rStart;
    const x2 = cx + cos(a + random(-0.9, 0.9)) * rEnd;
    const y2 = cy + sin(a + random(-0.9, 0.9)) * rEnd;
    nodes.push({ x: x2, y: y2, r: 1.5 + random(2), type: 'hair', hue: palette.burgundy.h });
    const idx = nodes.length - 1;
    // attach to nearest outer node
    let nearest = -1;
    let bestD = Infinity;
    for (let k = 0; k < nodes.length - 1; k++) {
      if (nodes[k].type !== 'outer' && nodes[k].type !== 'mid') continue;
      const dd = dist(x1, y1, nodes[k].x, nodes[k].y);
      if (dd < bestD) { bestD = dd; nearest = k; }
    }
    if (nearest >= 0) addFilament(idx, nearest, 0.6, palette.wine);
  }
}

function addFilament(ai, bi, thickness, color) {
  const a = nodes[ai];
  const b = nodes[bi];
  const midX = (a.x + b.x) * 0.5;
  const midY = (a.y + b.y) * 0.5;
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const perpX = -dy / len, perpY = dx / len;

  filaments.push({
    a: a, b: b,
    ai: ai, bi: bi,
    midX: midX, midY: midY,
    perpX: perpX, perpY: perpY,
    thickness: thickness,
    color: color,
    noiseOffset: random(1000),
    cp1: createVector(0, 0),
    cp2: createVector(0, 0)
  });
}

function buildCandles() {
  candles = [];
  const n = 7;
  const arcR = min(width, height) * 0.38;
  for (let i = 0; i < n; i++) {
    const a = map(i, 0, n - 1, -PI * 0.55, PI * 0.55) + PI / 2;
    const x = cx + cos(a) * arcR;
    const y = cy + sin(a) * arcR;
    const bullish = random() > 0.45;
    candles.push({
      x: x, y: y,
      w: random(6, 11),
      h: random(35, 75),
      bullish: bullish,
      hue: bullish ? palette.gold.h : palette.burgundy.h,
      pulseOffset: random(1000),
      wickTop: random(8, 20),
      wickBottom: random(8, 20)
    });
  }
}

function drawStructure() {
  const bg = palette.voidC;
  structureLayer.background(bg.h, bg.s, bg.b);

  // subtle radial ink vignette drawn into structure
  structureLayer.noStroke();
  const vSteps = 80;
  for (let i = vSteps; i >= 0; i--) {
    const rr = max(width, height) * (i / vSteps);
    const alpha = map(i, 0, vSteps, 0, 0.7, true);
    structureLayer.fill(palette.deepInk.h, palette.deepInk.s, palette.deepInk.b, alpha);
    structureLayer.ellipse(cx, cy, rr * 2, rr * 2);
  }

  // draw candle bodies into structure (stable geometry)
  for (let c of candles) {
    structureLayer.noStroke();
    structureLayer.fill(c.hue, c.bullish ? 70 : 55, c.bullish ? 55 : 42, 22);
    structureLayer.rect(c.x - c.w / 2 - 4, c.y - c.h / 2 - 4, c.w + 8, c.h + 8, 3);
  }
}

function simulateStep() {
  t += 0.008;

  for (let f of filaments) updateFilamentControlPoints(f);

  // spawn pulses
  if (frameCount % 6 === 0 && random() < 0.7) {
    const f = random(filaments);
    pulses.push({
      filament: f,
      t: 0,
      speed: random(0.003, 0.012),
      size: random(1.2, 3.5),
      hue: f.color === palette.gold ? palette.gold.h : (random() < 0.55 ? palette.gold.h : palette.burgundy.h),
      life: 1.0
    });
  }

  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.t += p.speed;
    if (p.t >= 1) pulses.splice(i, 1);
  }
}

function updateFilamentControlPoints(f) {
  const bend = min(width, height) * 0.09;
  const n1 = noise(f.noiseOffset, t * 1.3) - 0.5;
  const n2 = noise(f.noiseOffset + 1000, t * 1.5) - 0.5;
  f.cp1.set(
    lerp(f.a.x, f.midX, 0.5) + f.perpX * n1 * bend,
    lerp(f.a.y, f.midY, 0.5) + f.perpY * n1 * bend
  );
  f.cp2.set(
    lerp(f.b.x, f.midX, 0.5) + f.perpX * n2 * bend,
    lerp(f.b.y, f.midY, 0.5) + f.perpY * n2 * bend
  );
}

function draw() {
  if (CONFIG.paused) return;
  simulateStep();

  pulseLayer.clear();
  glowLayer.clear();
  bodyLayer.clear();
  coreLayer.clear();

  // draw dynamic filaments onto pulseLayer (cleared every frame) so they breathe
  pulseLayer.noFill();
  for (let f of filaments) {
    pulseLayer.strokeWeight(f.thickness);
    pulseLayer.stroke(f.color.h, f.color.s, f.color.b, 34);
    pulseLayer.bezier(
      f.a.x, f.a.y,
      f.cp1.x, f.cp1.y,
      f.cp2.x, f.cp2.y,
      f.b.x, f.b.y
    );
  }

  // draw pulses
  noStroke();
  for (let p of pulses) {
    const pt = bezierPoint(p.filament, p.t);
    const alpha = (1 - p.t) * 100 + 30;
    glowLayer.fill(p.hue, 70, 100, alpha * 0.25);
    glowLayer.ellipse(pt.x, pt.y, p.size * 3, p.size * 3);
    bodyLayer.fill(p.hue, 80, 98, alpha);
    bodyLayer.ellipse(pt.x, pt.y, p.size, p.size);
  }

  // draw candle flames and wicks (animated)
  for (let c of candles) {
    const flicker = 0.8 + 0.2 * sin(t * 8 + c.pulseOffset);
    const topY = c.y - c.h / 2 - c.wickTop;
    const bottomY = c.y + c.h / 2 + c.wickBottom;

    // wick
    glowLayer.stroke(palette.candleWick.h, palette.candleWick.s, palette.candleWick.b, 40);
    glowLayer.strokeWeight(1.2);
    glowLayer.line(c.x, topY, c.x, topY - 10);
    glowLayer.line(c.x, bottomY, c.x, bottomY + 10);

    // flame
    const flameH = 16 * flicker;
    const flameW = 9 * flicker;
    glowLayer.noStroke();
    for (let i = 20; i >= 0; i--) {
      const rr = map(i, 0, 20, 0, flameW);
      const aa = map(i, 0, 20, 8, 0, true);
      glowLayer.fill(c.hue, 70, 100, aa);
      glowLayer.ellipse(c.x, topY - flameH * 0.3, rr * 2, flameH * 2 * (i / 20));
    }
    bodyLayer.fill(c.hue, 55, 100, 80);
    bodyLayer.ellipse(c.x, topY - flameH * 0.25, flameW * 0.6, flameH * 0.9);
  }

  // central heart-core — stepped radial gradient
  const pulse = 0.85 + 0.15 * sin(t * 3);
  const hr = heartRadius * pulse;
  coreLayer.noStroke();
  const auraSteps = 90;
  const auraMaxR = hr * 8;
  for (let i = auraSteps; i >= 0; i--) {
    const rr = auraMaxR * (i / auraSteps);
    const alpha = map(i, 0, auraSteps, 0, 1.2, true);
    coreLayer.fill(palette.burgundy.h, 50, 85, alpha);
    coreLayer.ellipse(cx, cy, rr * 2, rr * 2);
  }

  // heart shape glow
  coreLayer.fill(palette.gold.h, 20, 100, 12 + pulse * 8);
  drawHeart(coreLayer, cx, cy, hr * 2.2);
  coreLayer.fill(palette.burgundy.h, 70, 95, 35 + pulse * 15);
  drawHeart(coreLayer, cx, cy, hr * 1.3);
  coreLayer.fill(palette.gold.h, 14, 100, 55 + pulse * 22);
  drawHeart(coreLayer, cx, cy, hr * 0.55);

  // draw nodes
  for (let n of nodes) {
    if (n.type === 'hair') continue;
    bodyLayer.noStroke();
    bodyLayer.fill(n.hue, n.type === 'core' ? 0 : 60, n.type === 'core' ? 100 : 90, n.type === 'core' ? 80 : 55);
    bodyLayer.ellipse(n.x, n.y, n.r * (n.type === 'core' ? 0.25 : 1.4), n.r * (n.type === 'core' ? 0.25 : 1.4));
  }

  // composite
  background(palette.voidC.h, palette.voidC.s, palette.voidC.b);
  image(structureLayer, 0, 0);
  image(pulseLayer, 0, 0);
  image(glowLayer, 0, 0);
  image(coreLayer, 0, 0);
  image(bodyLayer, 0, 0);

  // subtle top vignette to hold edges
  noFill();
  stroke(palette.voidC.h, palette.voidC.s, palette.voidC.b, 12);
  strokeWeight(min(width, height) * 0.08);
  rect(0, 0, width, height);
}

function drawHeart(layer, x, y, size) {
  layer.push();
  layer.translate(x, y);
  layer.scale(size / 60);
  layer.beginShape();
  for (let a = 0; a < TAU; a += 0.05) {
    const r = 15 * (1 - sin(a));
    const hx = 16 * pow(sin(a), 3);
    const hy = -(13 * cos(a) - 5 * cos(2 * a) - 2 * cos(3 * a) - cos(4 * a));
    layer.vertex(hx, hy);
  }
  layer.endShape(CLOSE);
  layer.pop();
}

function bezierPoint(f, tt) {
  const u = 1 - tt;
  const x = u*u*u*f.a.x + 3*u*u*tt*f.cp1.x + 3*u*tt*tt*f.cp2.x + tt*tt*tt*f.b.x;
  const y = u*u*u*f.a.y + 3*u*u*tt*f.cp1.y + 3*u*tt*tt*f.cp2.y + tt*tt*tt*f.b.y;
  return createVector(x, y);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  cx = width / 2;
  cy = height / 2;
  heartRadius = min(width, height) * 0.09;
  structureLayer = createGraphics(width, height);
  pulseLayer = createGraphics(width, height);
  glowLayer = createGraphics(width, height);
  bodyLayer = createGraphics(width, height);
  coreLayer = createGraphics(width, height);
  [structureLayer, pulseLayer, glowLayer, bodyLayer, coreLayer].forEach(l => {
    l.colorMode(HSB, 360, 100, 100, 100);
    l.clear();
  });
  buildSigil();
  buildCandles();
  drawStructure();
}

function keyPressed() {
  if (key === 'r' || key === 'R') {
    CONFIG.seed = floor(random(999999));
    randomSeed(CONFIG.seed);
    noiseSeed(CONFIG.seed);
    t = 0;
    buildSigil();
    buildCandles();
    drawStructure();
  }
  if (key === 's' || key === 'S') {
    saveCanvas('house-victoria-sigil-' + CONFIG.seed, 'png');
  }
  if (key === 'g' || key === 'G') {
    saveGif('house-victoria-sigil-' + CONFIG.seed, 5);
  }
  if (key === ' ') {
    CONFIG.paused = !CONFIG.paused;
  }
}

function mousePressed() {
  // spawn a burst of pulses toward/from nearest node
  let nearest = null;
  let bestD = Infinity;
  for (let n of nodes) {
    const d = dist(mouseX, mouseY, n.x, n.y);
    if (d < bestD) { bestD = d; nearest = n; }
  }
  if (nearest) {
    const matches = filaments.filter(f => f.a === nearest || f.b === nearest);
    for (let k = 0; k < min(5, matches.length); k++) {
      pulses.push({
        filament: matches[k],
        t: matches[k].a === nearest ? 0 : 0.95,
        speed: random(0.01, 0.02),
        size: random(2, 5),
        hue: palette.gold.h,
        life: 1.0
      });
    }
  }
}
</script>
</body>
</html>
