<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resting Organism</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0a0306;
    }
    canvas {
      display: block;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
</head>
<body>
<script>
p5.disableFriendlyErrors = true;

const CONFIG = {
  seed: 20260708,
  branchDepth: 5,
  branchAngle: 25.7,
  branchLen: 7,
  symmetries: 5,
  particles: 140,
  burnInFrames: 200
};

let palette;
let branches = [];
let particles = [];
let structureLayer, trailLayer, bloomLayer;
let breathPhase = 0;
let step = 0;
let paused = false;

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  randomSeed(CONFIG.seed);
  noiseSeed(CONFIG.seed);

  palette = {
    bg: color(340, 30, 6),
    burgundy: color(350, 72, 28),
    ember: color(38, 92, 88),
    copper: color(22, 68, 42)
  };

  structureLayer = createGraphics(width, height);
  structureLayer.colorMode(HSB, 360, 100, 100, 100);

  trailLayer = createGraphics(width, height);
  trailLayer.colorMode(HSB, 360, 100, 100, 100);

  bloomLayer = createGraphics(width, height);
  bloomLayer.colorMode(HSB, 360, 100, 100, 100);
  bloomLayer.blendMode(ADD);

  regenerate();

  for (let i = 0; i < CONFIG.burnInFrames; i++) {
    simulateStep();
  }
}

function regenerate() {
  branches = buildBranches();
  particles = [];
  for (let i = 0; i < CONFIG.particles; i++) {
    particles.push(new Particle());
  }
  trailLayer.clear();
  structureLayer.clear();
  bloomLayer.clear();
  breathPhase = 0;
  step = 0;
}

function draw() {
  background(palette.bg);

  if (!paused) {
    simulateStep();
  }

  image(trailLayer, 0, 0);
  image(structureLayer, 0, 0);
  image(bloomLayer, 0, 0);
}

function simulateStep() {
  breathPhase += 0.012;
  step++;

  let breath = 1 + sin(breathPhase) * 0.025;
  let sway = sin(breathPhase * 0.35) * 0.008;

  trailLayer.noStroke();
  trailLayer.fill(hue(palette.bg), saturation(palette.bg), brightness(palette.bg), 3.5);
  trailLayer.rect(0, 0, width, height);

  structureLayer.clear();
  structureLayer.push();
  structureLayer.translate(width / 2, height / 2);
  structureLayer.scale(breath);
  structureLayer.rotate(sway);
  drawTendrils(structureLayer);
  structureLayer.pop();

  bloomLayer.clear();
  bloomLayer.push();
  bloomLayer.translate(width / 2, height / 2);
  bloomLayer.scale(breath);
  drawCore(bloomLayer);
  bloomLayer.pop();

  for (let p of particles) {
    p.update();
    p.draw(trailLayer, bloomLayer);
  }
}

function buildBranches() {
  let axiom = 'F';
  for (let i = 0; i < CONFIG.branchDepth; i++) {
    let next = '';
    for (let j = 0; j < axiom.length; j++) {
      let ch = axiom.charAt(j);
      next += (ch === 'F') ? 'F[+F]F[-F]F' : ch;
    }
    axiom = next;
  }

  let segments = [];
  let x = 0, y = 0;
  let angle = -PI / 2;
  let stack = [];
  let depth = 0;

  for (let i = 0; i < axiom.length; i++) {
    let ch = axiom.charAt(i);
    if (ch === 'F') {
      let x2 = x + cos(angle) * CONFIG.branchLen;
      let y2 = y + sin(angle) * CONFIG.branchLen;
      segments.push({ x1: x, y1: y, x2: x2, y2: y2, depth: depth });
      x = x2;
      y = y2;
    } else if (ch === '+') {
      angle += radians(CONFIG.branchAngle);
    } else if (ch === '-') {
      angle -= radians(CONFIG.branchAngle);
    } else if (ch === '[') {
      stack.push({ x, y, angle, depth });
      depth++;
    } else if (ch === ']') {
      let st = stack.pop();
      x = st.x;
      y = st.y;
      angle = st.angle;
      depth = st.depth;
    }
  }
  return segments;
}

function drawTendrils(layer) {
  let maxDepth = CONFIG.branchDepth;
  for (let seg of branches) {
    let t = seg.depth / maxDepth;
    let c = lerpColor(palette.copper, palette.burgundy, t);
    if (t < 0.25) {
      c = lerpColor(palette.ember, palette.copper, t * 4);
    }
    layer.stroke(c);
    layer.strokeWeight(map(t, 0, 1, 1.6, 0.35));
    layer.line(seg.x1, seg.y1, seg.x2, seg.y2);
  }

  for (let k = 1; k < CONFIG.symmetries; k++) {
    layer.push();
    layer.rotate((TWO_PI / CONFIG.symmetries) * k);
    for (let seg of branches) {
      let t = seg.depth / maxDepth;
      let c = lerpColor(palette.copper, palette.burgundy, t);
      if (t < 0.25) {
        c = lerpColor(palette.ember, palette.copper, t * 4);
      }
      layer.stroke(c);
      layer.strokeWeight(map(t, 0, 1, 1.6, 0.35));
      layer.line(seg.x1, seg.y1, seg.x2, seg.y2);
    }
    layer.pop();
  }
}

function drawCore(layer) {
  let rings = 80;
  let pulse = 1 + sin(breathPhase) * 0.04;
  for (let i = rings; i >= 0; i--) {
    let t = i / rings;
    let r = map(i, 0, rings, 0, 130) * pulse;
    let c = lerpColor(palette.ember, palette.burgundy, t);
    layer.noStroke();
    layer.fill(hue(c), saturation(c), brightness(c), 2.5);
    layer.ellipse(0, 0, r * 2, r * 2);
  }

  layer.fill(hue(palette.ember), saturation(palette.ember), 96, 18);
  layer.ellipse(0, 0, 22 * pulse, 22 * pulse);
}

class Particle {
  constructor() {
    this.reset();
  }

  reset() {
    let angle = random(TWO_PI);
    let r = random(30, 220);
    this.pos = createVector(width / 2 + cos(angle) * r, height / 2 + sin(angle) * r);
    this.vel = p5.Vector.random2D().mult(random(0.08, 0.32));
    this.maxLife = random(180, 420);
    this.life = this.maxLife;
    this.history = [];
  }

  update() {
    let n = noise(this.pos.x * 0.004, this.pos.y * 0.004, step * 0.002);
    let theta = n * TWO_PI * 2.5;
    this.vel.add(createVector(cos(theta) * 0.012, sin(theta) * 0.012));
    this.vel.limit(0.55);
    this.pos.add(this.vel);

    this.history.push(this.pos.copy());
    if (this.history.length > 36) {
      this.history.shift();
    }

    this.life--;
    if (
      this.life <= 0 ||
      this.pos.x < -60 ||
      this.pos.x > width + 60 ||
      this.pos.y < -60 ||
      this.pos.y > height + 60
    ) {
      this.reset();
    }
  }

  draw(trail, bloom) {
    let lifeRatio = this.life / this.maxLife;
    if (this.history.length > 1) {
      trail.noFill();
      for (let i = 1; i < this.history.length; i++) {
        let a = map(i, 0, this.history.length, 0, 22) * lifeRatio;
        let t = i / this.history.length;
        let c = lerpColor(palette.burgundy, palette.ember, t);
        trail.stroke(hue(c), saturation(c), brightness(c), a);
        trail.strokeWeight(map(t, 0, 1, 0.5, 1.4));
        trail.line(
          this.history[i - 1].x,
          this.history[i - 1].y,
          this.history[i].x,
          this.history[i].y
        );
      }
    }

    bloom.noStroke();
    let glow = lerpColor(palette.copper, palette.ember, lifeRatio);
    bloom.fill(hue(glow), saturation(glow), brightness(glow), 24 * lifeRatio);
    bloom.ellipse(this.pos.x, this.pos.y, 5, 5);
  }
}

function keyPressed() {
  if (key === 's' || key === 'S') {
    saveCanvas('resting-organism-' + CONFIG.seed, 'png');
  } else if (key === 'r' || key === 'R') {
    CONFIG.seed = floor(random(1000000));
    randomSeed(CONFIG.seed);
    noiseSeed(CONFIG.seed);
    regenerate();
  } else if (key === ' ') {
    paused = !paused;
  } else if (key === 'g' || key === 'G') {
    saveGif('resting-organism-' + CONFIG.seed, 5);
  }
}

function mousePressed() {
  let count = min(12, particles.length);
  for (let i = 0; i < count; i++) {
    let p = particles[i];
    p.pos.set(mouseX, mouseY);
    p.vel = p5.Vector.random2D().mult(random(0.1, 0.5));
    p.life = random(160, 300);
    p.maxLife = p.life;
    p.history = [];
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  structureLayer.resizeCanvas(width, height);
  trailLayer.resizeCanvas(width, height);
  bloomLayer.resizeCanvas(width, height);
  regenerate();
}
</script>
</body>
</html>
